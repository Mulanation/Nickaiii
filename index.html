
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101014">
<title>NICK AI - Your AI Assistant</title>

<style>
:root {
  --bg: #101014;
  --sidebar: #17171d;
  --panel: #202027;
  --text: #f5f5f7;
  --muted: #92929f;
  --accent: #8b5cf6;
  --border: #303039;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, sans-serif;
  height: 100dvh;
  overflow: hidden;
}

button, textarea { font: inherit; }

.app {
  display: flex;
  height: 100dvh;
}

/* SIDEBAR */

.sidebar {
  width: 265px;
  background: var(--sidebar);
  border-right: 1px solid var(--border);
  padding: 18px;
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
}

.brand {
  display: flex;
  align-items: center;
  gap: 11px;
  font-size: 21px;
  font-weight: bold;
  margin-bottom: 27px;
}

.logo {
  width: 38px;
  height: 38px;
  border-radius: 12px;
  background: linear-gradient(135deg,#8b5cf6,#2563eb);
  display: grid;
  place-items: center;
  font-weight: bold;
}

.new-chat {
  background: var(--panel);
  border: 1px solid var(--border);
  color: white;
  padding: 13px;
  border-radius: 10px;
  text-align: left;
  cursor: pointer;
  margin-bottom: 25px;
}

.section-label {
  color: var(--muted);
  font-size: 12px;
  margin-bottom: 12px;
}

.history {
  flex: 1;
  overflow-y: auto;
}

.history-item {
  padding: 12px;
  border-radius: 9px;
  font-size: 13px;
  cursor: pointer;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  color: #ddd;
  margin-bottom: 4px;
}

.history-item:hover,
.history-item.active {
  background: var(--panel);
}

.profile {
  border-top: 1px solid var(--border);
  padding-top: 16px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.avatar {
  width: 36px;
  height: 36px;
  background: #673ab7;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-weight: bold;
}

/* MAIN CHAT */

.main {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
}

.topbar {
  height: 65px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 22px;
}

.topbar h3 {
  font-size: 16px;
  margin: 0;
}

.menu-btn {
  display: none;
  background: none;
  color: white;
  border: 0;
  font-size: 23px;
  cursor: pointer;
}

.status {
  color: #a78bfa;
  font-size: 12px;
}

.chat {
  flex: 1;
  overflow-y: auto;
  padding: 30px 18px;
  scroll-behavior: smooth;
}

.chat-inner {
  max-width: 800px;
  margin: auto;
}

.welcome {
  min-height: 55vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
}

.welcome-logo {
  width: 70px;
  height: 70px;
  background: linear-gradient(135deg,#8b5cf6,#2563eb);
  border-radius: 23px;
  display: grid;
  place-items: center;
  font-size: 30px;
  font-weight: bold;
  margin-bottom: 22px;
}

.welcome h1 {
  font-size: 30px;
  margin: 0 0 12px;
}

.welcome p {
  color: var(--muted);
  font-size: 14px;
}

.suggestions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  width: 100%;
  max-width: 580px;
  margin-top: 28px;
}

.suggestion {
  padding: 15px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 12px;
  color: #ddd;
  text-align: left;
  cursor: pointer;
  font-size: 13px;
}

.suggestion:hover {
  border-color: var(--accent);
}

/* MESSAGES */

.message {
  display: flex;
  gap: 12px;
  margin: 24px 0;
  align-items: flex-start;
}

.message-avatar {
  width: 32px;
  height: 32px;
  flex-shrink: 0;
  background: var(--panel);
  border-radius: 10px;
  display: grid;
  place-items: center;
  font-size: 13px;
}

.message.user .message-avatar {
  background: #49328b;
}

.message-content {
  line-height: 1.7;
  font-size: 14px;
  overflow-wrap: anywhere;
  padding-top: 4px;
  white-space: pre-wrap;
}

.message.ai .message-content {
  color: #e3e3e8;
}

.message.error .message-content {
  color: #fca5a5;
}

/* INPUT */

.input-area {
  padding: 15px 18px 20px;
}

.input-box {
  max-width: 800px;
  margin: auto;
  background: var(--panel);
  border: 1px solid #3b3b46;
  border-radius: 17px;
  padding: 12px;
}

textarea {
  width: 100%;
  background: transparent;
  color: white;
  border: none;
  outline: none;
  resize: none;
  min-height: 42px;
  max-height: 150px;
  padding: 8px;
  font-size: 14px;
}

textarea::placeholder { color: #888895; }

.input-actions {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.search-toggle {
  background: transparent;
  color: #aaa;
  border: 1px solid #41414c;
  border-radius: 20px;
  padding: 8px 12px;
  cursor: pointer;
  font-size: 12px;
}

.search-toggle.active {
  color: #c4b5fd;
  border-color: var(--accent);
}

.send-btn {
  background: var(--accent);
  color: white;
  border: 0;
  border-radius: 10px;
  width: 39px;
  height: 39px;
  font-size: 20px;
  cursor: pointer;
}

.send-btn:disabled {
  opacity: .5;
  cursor: not-allowed;
}

.disclaimer {
  text-align: center;
  color: #777782;
  font-size: 10px;
  margin-top: 12px;
}

/* MOBILE */

@media(max-width:700px) {
  .sidebar {
    position: fixed;
    left: -280px;
    top: 0;
    bottom: 0;
    z-index: 10;
    transition: left .25s;
  }

  .sidebar.open { left: 0; }

  .menu-btn { display: block; }

  .topbar { padding: 0 14px; }

  .welcome h1 { font-size: 25px; }

  .suggestions { grid-template-columns: 1fr; }

  .chat { padding: 20px 13px; }

  .input-area { padding: 10px 12px 15px; }
}
</style>
</head>

<body>

<div class="app">

  <aside class="sidebar" id="sidebar">

    <div class="brand">
      <div class="logo">N</div>
      NICK AI
    </div>

    <button class="new-chat" onclick="newChat()">
      ＋ New chat
    </button>

    <div class="section-label">YOUR CONVERSATIONS</div>

    <div class="history" id="history"></div>

    <div class="profile">
      <div class="avatar">N</div>
      <div>
        <strong>NICK AI</strong>
        <div style="font-size:11px;color:#92929f;margin-top:4px">
          AI Assistant
        </div>
      </div>
    </div>

  </aside>

  <main class="main">

    <header class="topbar">

      <div style="display:flex;align-items:center;gap:12px">
        <button class="menu-btn" onclick="toggleSidebar()">☰</button>
        <h3>NICK AI</h3>
      </div>

      <div class="status">● AI Assistant</div>

    </header>

    <section class="chat" id="chat">
      <div class="chat-inner" id="chatInner"></div>
    </section>

    <section class="input-area">

      <div class="input-box">

        <textarea
          id="prompt"
          placeholder="Message NICK AI..."
          rows="1"
        ></textarea>

        <div class="input-actions">

          <button
            class="search-toggle"
            id="searchToggle"
            onclick="toggleSearch()"
          >
            🌐 Web search: OFF
          </button>

          <button
            class="send-btn"
            id="sendBtn"
            onclick="sendMessage()"
          >↑</button>

        </div>

      </div>

      <div class="disclaimer">
        NICK AI can make mistakes. Check important information.
      </div>

    </section>

  </main>

</div>

<script>
const API_URL = "/.netlify/functions/chat";

let conversations = JSON.parse(
  localStorage.getItem("nick_ai_chats") || "[]"
);

let currentId = null;
let webSearch = false;
let loading = false;

const chatInner = document.getElementById("chatInner");
const promptBox = document.getElementById("prompt");
const sendBtn = document.getElementById("sendBtn");

function saveChats() {
  localStorage.setItem(
    "nick_ai_chats",
    JSON.stringify(conversations)
  );
}

function currentChat() {
  return conversations.find(c => c.id === currentId);
}

function escapeHTML(text) {
  return String(text).replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#039;"
  })[char]);
}

function showWelcome() {
  chatInner.innerHTML = `
    <div class="welcome">
      <div class="welcome-logo">N</div>
      <h1>Welcome to NICK AI</h1>
      <p>Your intelligent assistant. Ask anything, anytime.</p>

      <div class="suggestions">
        <button class="suggestion"
          onclick="useSuggestion('Explain artificial intelligence in simple words')">
          💡 Explain something
        </button>

        <button class="suggestion"
          onclick="useSuggestion('Find the latest technology news')">
          🌐 Search the web
        </button>

        <button class="suggestion"
          onclick="useSuggestion('Help me write a professional email')">
          ✍️ Help me write
        </button>

        <button class="suggestion"
          onclick="useSuggestion('Teach me JavaScript step by step')">
          💻 Learn programming
        </button>
      </div>
    </div>
  `;
}

function renderMessages() {
  const chat = currentChat();

  if (!chat || chat.messages.length === 0) {
    showWelcome();
    return;
  }

  chatInner.innerHTML = chat.messages.map(m => `
    <div class="message ${m.role === "user" ? "user" : "ai"}">
      <div class="message-avatar">
        ${m.role === "user" ? "N" : "✦"}
      </div>
      <div class="message-content">${escapeHTML(m.content)}</div>
    </div>
  `).join("");

  chatInner.innerHTML += `
    ${loading ? `
      <div class="message ai">
        <div class="message-avatar">✦</div>
        <div class="message-content">NICK AI is thinking...</div>
      </div>
    ` : ""}
  `;

  scrollBottom();
}

function renderHistory() {
  const history = document.getElementById("history");

  history.innerHTML = conversations.map(c => `
    <div class="history-item ${c.id === currentId ? "active" : ""}"
      onclick="openChat('${c.id}')">
      ${escapeHTML(c.title)}
    </div>
  `).join("");
}

function scrollBottom() {
  const chat = document.getElementById("chat");
  chat.scrollTop = chat.scrollHeight;
}

function newChat() {
  if (loading) return;

  currentId = null;
  renderMessages();
  renderHistory();

  promptBox.value = "";
  promptBox.focus();

  document.getElementById("sidebar").classList.remove("open");
}

function openChat(id) {
  if (loading) return;

  currentId = id;
  renderMessages();
  renderHistory();

  document.getElementById("sidebar").classList.remove("open");
}

function toggleSidebar() {
  document.getElementById("sidebar").classList.toggle("open");
}

function toggleSearch() {
  webSearch = !webSearch;

  const button = document.getElementById("searchToggle");

  button.classList.toggle("active", webSearch);
  button.textContent = webSearch
    ? "🌐 Web search: ON"
    : "🌐 Web search: OFF";
}

function useSuggestion(text) {
  promptBox.value = text;
  sendMessage();
}

async function sendMessage() {
  const message = promptBox.value.trim();

  if (!message || loading) return;

  if (!currentChat()) {
    currentId = Date.now().toString();

    conversations.unshift({
      id: currentId,
      title: message.slice(0, 35),
      messages: []
    });
  }

  const chat = currentChat();

  chat.messages.push({
    role: "user",
    content: message
  });

  promptBox.value = "";
  promptBox.style.height = "42px";

  loading = true;
  sendBtn.disabled = true;

  saveChats();
  renderHistory();
  renderMessages();

  try {
    const response = await fetch(API_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        message,
        search: webSearch,
        history: chat.messages.slice(-12, -1)
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "AI request failed.");
    }

    if (!data.reply) {
      throw new Error("The AI returned an empty response.");
    }

    chat.messages.push({
      role: "assistant",
      content: data.reply
    });

  } catch (error) {
    chat.messages.push({
      role: "assistant",
      content: "Sorry, something went wrong: " + error.message
    });
  }

  loading = false;
  sendBtn.disabled = false;

  saveChats();
  renderMessages();
  renderHistory();
}

promptBox.addEventListener("keydown", event => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    sendMessage();
  }
});

promptBox.addEventListener("input", () => {
  promptBox.style.height = "42px";
  promptBox.style.height =
    Math.min(promptBox.scrollHeight, 150) + "px";
});

renderHistory();
renderMessages();
</script>

</body>
</html>
